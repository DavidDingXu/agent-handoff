version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - misspell
    - copyloopvar
  exclusions:
    rules:
      # Deployment fixtures and worker JS are intentionally self-contained.
      - path: deploy/.*
        linters: [all]

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
