version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - misspell
    - copyloopvar
  exclusions:
    rules:
      # Deployment fixtures and worker JS are intentionally self-contained.
      - path: deploy/.*
        linters: [all]
      # Test response writers and fixture builders intentionally ignore writes
      # after assertions; production paths remain fully checked.
      - path: _test\.go$
        linters: [errcheck]

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
