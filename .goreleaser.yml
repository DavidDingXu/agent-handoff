version: 2

project_name: agent-handoff

before:
  hooks:
    - go mod tidy

builds:
  - id: agent-handoff
    main: .
    binary: agent-handoff
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      # windows/arm64 has no practical audience for a CLI talking to local agent state
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
      - -buildvcs=false
    ldflags:
      - -s -w -X github.com/DavidDingXu/agent-handoff/internal/cli.Version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: binaries
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}-{{ .Version }}-{{ .Os }}-{{ .Arch }}
    files:
      - LICENSE
      - README.md
      - THIRD_PARTY_NOTICES.md
      - third_party_licenses/**

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch

release:
  draft: false
  prerelease: auto
  mode: append

snapshot:
  version_template: "{{ incpatch .Version }}-next"
