name: Feature request
description: Propose a focused improvement
title: "[Feature]: "
labels: [enhancement, triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What handoff workflow is blocked today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest user-visible change that solves it.
    validations:
      required: true
  - type: dropdown
    id: agents
    attributes:
      label: Affected agents
      multiple: true
      options:
        - Codex
        - Claude Code
        - Standalone CLI
        - Link service
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Security and compatibility
      description: Note any transcript, secret, macOS, Windows, or Linux implications.
