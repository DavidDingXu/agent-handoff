name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }} / ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["1.26.7"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1 -race

      - name: Build
        run: go build -trimpath .

      - name: Smoke (version)
        run: go run . version

      - name: Validate installer syntax
        if: runner.os != 'Windows'
        run: sh -n install.sh

      - name: Validate PowerShell installer syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: '[scriptblock]::Create((Get-Content ./install.ps1 -Raw)) | Out-Null'

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.7"
          cache: true

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: --timeout=5m

  worker:
    name: Worker syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Check and test worker
        working-directory: deploy/worker
        run: npm ci && npm test

  plugin:
    name: Plugin package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.7"
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Check manifest versions
        run: |
          version=$(jq -r .version .codex-plugin/plugin.json)
          test "$(jq -r .metadata.version .claude-plugin/marketplace.json)" = "$version"
          test "$(jq -r .version .claude-plugin/plugin.json)" = "$version"
          test "$(jq -r .version plugins/claude/.claude-plugin/plugin.json)" = "$version"
          test "$(jq -r .version plugins/dsh/package.json)" = "$version"
          test "$(jq -r '.plugins[0].version' .claude-plugin/marketplace.json)" = "$version"

      - name: Rebuild bundled binaries
        run: |
          version=$(jq -r .version .codex-plugin/plugin.json)
          make cross VERSION="v$version"

      - name: Verify bundled binaries are current
        run: git diff --exit-code -- bin

      - name: Install current Codex and Claude Code CLIs
        run: npm install --global @openai/codex @anthropic-ai/claude-code

      - name: Smoke install Codex plugin
        run: |
          export CODEX_HOME="$RUNNER_TEMP/codex-home"
          mkdir -p "$CODEX_HOME"
          codex plugin marketplace add "$GITHUB_WORKSPACE" --json
          codex plugin add agent-handoff@agent-handoff --json
          test "$(codex plugin list --json | jq -r '.installed[0].version')" = "$(jq -r .version .codex-plugin/plugin.json)"

      - name: Smoke install Claude Code plugin
        run: |
          export CLAUDE_CONFIG_DIR="$RUNNER_TEMP/claude-home"
          mkdir -p "$CLAUDE_CONFIG_DIR"
          claude plugin validate .
          claude plugin marketplace add "$GITHUB_WORKSPACE"
          claude plugin install agent-handoff@agent-handoff
          test "$(claude plugin list --json | jq -r '.[0].version')" = "$(jq -r .version .codex-plugin/plugin.json)"

      - name: Resume synthetic handoffs in current native clients
        env:
          AGENT_HANDOFF_NATIVE_TESTS: "1"
        run: go test ./internal/integration_test -run '^TestNativeClients$' -count=1 -race -v -timeout=5m

      - name: Validate and test the no-model Claude command
        run: |
          export CLAUDE_CONFIG_DIR="$RUNNER_TEMP/claude-mod-test"
          mkdir -p "$CLAUDE_CONFIG_DIR"
          claude plugin validate plugins/claude --strict
          claude plugin test plugins/claude

  dsh:
    name: DSH plugin (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: plugins/dsh
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24.14.1"
          cache: npm
          cache-dependency-path: plugins/dsh/package-lock.json
      - run: npm ci --ignore-scripts --no-fund --no-audit
      - run: npm run check
      - run: npm run package
      - run: npm run check:package
      - name: Verify DSH rc.1 persistence and continuation
        run: npm run check:compat
