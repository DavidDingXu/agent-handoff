name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: goreleaser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.7"
          cache: true

      - name: Run tests
        run: go test ./... -count=1 && go vet ./...

      - name: Check release version
        run: |
          version=${GITHUB_REF_NAME#v}
          test "$(jq -r .version .codex-plugin/plugin.json)" = "$version"
          test "$(jq -r .metadata.version .claude-plugin/marketplace.json)" = "$version"
          test "$(jq -r '.plugins[0].version' .claude-plugin/marketplace.json)" = "$version"

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
