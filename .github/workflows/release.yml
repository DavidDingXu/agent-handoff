name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  desktop-packages:
    name: Build desktop plugin archives
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.7"
          cache: true

      - name: Build Codex and Qoder packages
        run: |
          version=${GITHUB_REF_NAME#v}
          test "$(jq -r .version plugins/codex-ui/.codex-plugin/plugin.json)" = "$version"
          test "$(jq -r .version plugins/qoder/.qoder-plugin/plugin.json)" = "$version"
          for target in darwin-amd64 darwin-arm64 linux-amd64 linux-arm64 windows-amd64; do
            python3 plugins/codex-ui/package.py "$target" --out plugins/desktop/dist
            python3 plugins/qoder/package.py "$target" --out plugins/desktop/dist
          done
          python3 plugins/qoder/package.py darwin-universal --out plugins/desktop/dist
          macos_target="darwin-$(go env GOARCH)"
          python3 plugins/codex-ui/tests/package_smoke.py \
            "plugins/desktop/dist/agent-handoff-codex-ui-v$version-$macos_target.zip" \
            "plugins/desktop/dist/agent-handoff-codex-preview-v$version-$macos_target.zip"
          python3 plugins/qoder/tests/package_smoke.py \
            "plugins/desktop/dist/agent-handoff-qoder-v$version-darwin-universal.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: desktop-plugins
          path: plugins/desktop/dist/*.zip
          if-no-files-found: error
          compression-level: 0

  release:
    name: goreleaser
    needs: desktop-packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.7"
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: "24.14.1"
          cache: npm
          cache-dependency-path: plugins/dsh/package-lock.json

      - name: Run tests
        run: go test ./... -count=1 && go vet ./...

      - name: Check release version
        run: |
          version=${GITHUB_REF_NAME#v}
          test "$(jq -r .version .codex-plugin/plugin.json)" = "$version"
          test "$(jq -r .version .claude-plugin/plugin.json)" = "$version"
          test "$(jq -r .version plugins/claude/.claude-plugin/plugin.json)" = "$version"
          test "$(jq -r .version plugins/dsh/package.json)" = "$version"
          test "$(jq -r .metadata.version .claude-plugin/marketplace.json)" = "$version"
          test "$(jq -r '.plugins[0].version' .claude-plugin/marketplace.json)" = "$version"

      - name: Build matching transfer cores for DSH
        run: |
          version=${GITHUB_REF_NAME#v}
          for target in darwin-amd64 darwin-arm64 linux-amd64 linux-arm64 windows-amd64; do
            os=${target%-*}
            arch=${target##*-}
            ext=""
            if [ "$os" = windows ]; then ext=".exe"; fi
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -buildvcs=false \
              -ldflags "-s -w -X github.com/DavidDingXu/agent-handoff/internal/cli.Version=$version" \
              -o "plugins/dsh/bin/$target/agent-handoff$ext" .
          done

      - name: Build and verify DSH release package
        working-directory: plugins/dsh
        run: |
          npm ci --ignore-scripts --no-fund --no-audit
          npm run check
          mkdir -p dist
          npm pack --ignore-scripts --pack-destination dist
          npm run check:package

      - uses: actions/download-artifact@v8
        with:
          name: desktop-plugins
          path: plugins/desktop/dist

      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
